services:
  postgres:
    image: postgres:16
    container_name: service-booking-postgres
    restart: unless-stopped

    environment:
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}

    volumes:
      - postgres_data:/var/lib/postgresql/data

    networks:
      - service-booking-network

  api:
    build:
      context: ./backend/ServiceBooking.Api
      dockerfile: Dockerfile

    container_name: service-booking-api
    restart: unless-stopped

    environment:
      ASPNETCORE_ENVIRONMENT: Production
      ASPNETCORE_URLS: http://+:8080

      ConnectionStrings__DefaultConnection: "Host=postgres;Port=5432;Database=${POSTGRES_DB};Username=${POSTGRES_USER};Password=${POSTGRES_PASSWORD}"

      Jwt__Key: ${JWT_KEY}

    expose:
      - "8080"

    depends_on:
      - postgres

    networks:
      - service-booking-network

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile

      args:
        NEXT_PUBLIC_API_URL: /api

    container_name: service-booking-frontend
    restart: unless-stopped

    expose:
      - "3000"

    depends_on:
      - api

    networks:
      - service-booking-network

  nginx:
    image: nginx:alpine
    container_name: service-booking-nginx
    restart: unless-stopped

    ports:
      - "80:80"

    command:
      - /bin/sh
      - -c
      - |
        printf '%s\n' \
          'server {' \
          '    listen 80;' \
          '    server_name _;' \
          '' \
          '    location /api/ {' \
          '        proxy_pass http://api:8080;' \
          '        proxy_http_version 1.1;' \
          '        proxy_set_header Host $$host;' \
          '        proxy_set_header X-Real-IP $$remote_addr;' \
          '        proxy_set_header X-Forwarded-For $$proxy_add_x_forwarded_for;' \
          '        proxy_set_header X-Forwarded-Proto $$scheme;' \
          '    }' \
          '' \
          '    location / {' \
          '        proxy_pass http://frontend:3000;' \
          '        proxy_http_version 1.1;' \
          '        proxy_set_header Host $$host;' \
          '        proxy_set_header X-Real-IP $$remote_addr;' \
          '        proxy_set_header X-Forwarded-For $$proxy_add_x_forwarded_for;' \
          '        proxy_set_header X-Forwarded-Proto $$scheme;' \
          '        proxy_set_header Upgrade $$http_upgrade;' \
          '        proxy_set_header Connection "upgrade";' \
          '    }' \
          '}' > /etc/nginx/conf.d/default.conf
        nginx -g 'daemon off;'

    depends_on:
      - frontend
      - api

    networks:
      - service-booking-network

volumes:
  postgres_data:

networks:
  service-booking-network:
    driver: bridge
